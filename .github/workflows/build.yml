name: build
on:
  push:
    branches: [decomp]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: SDK 37
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $SDKM --licenses >/dev/null || true
          $SDKM "platforms;android-37" || $SDKM --list | grep -E 'platforms;android-3[6-9]|build-tools;3[6-9]' | head -20
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: assembleDebug
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -o pipefail
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks; export RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks; echo "signing: release key"; else echo "signing: debug key (no secrets)"; fi
          gradle :app:assembleDebug :app:assembleRelease --no-daemon 2>&1 | tee build.log
      - name: unit tests (report logic)
        if: success()
        run: |
          gradle :app:testDebugUnitTest --no-daemon > unit.log 2>&1 && echo "UNIT OK" >> unit.log || echo "UNIT FAILED" >> unit.log
          tail -30 unit.log
      - name: dependency vulnerabilities (OSV)
        if: always()
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q > deps.txt 2>/dev/null || true
          python3 .github/osv.py deps.txt > osv.txt 2>&1 || echo "osv check failed" >> osv.txt
          head -40 osv.txt
      - name: errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -300
      - name: enable KVM
        if: success()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: smoke test on emulator
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/smoke.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: Report-debug, path: app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }
      - name: publish log/apk to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b ci-log
          cp $GITHUB_WORKSPACE/build.log . 2>/dev/null || echo "no build.log" > build.log
          grep -nE '^e: |^w: .*(unresolved|Unresolved)|error:|What went wrong|FAILURE' -A4 build.log > errors.txt || true
          cp $GITHUB_WORKSPACE/app/build/outputs/apk/release/*.apk . 2>/dev/null || true
          for f in $GITHUB_WORKSPACE/app/build/outputs/apk/debug/*.apk; do [ -f "$f" ] && [ $(stat -c %s "$f") -lt 90000000 ] && cp "$f" . ; done
          ls -la *.apk || true
          mkdir -p smoke && cp $GITHUB_WORKSPACE/smoke/* smoke/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/osv.txt . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/unit.log . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/app/build/test-out.txt . 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/app/build/test-results/testDebugUnitTest unit-results 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > STATUS
          for a in *.apk; do $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$a" 2>/dev/null | grep -m2 -E "DN|SHA-256" | sed "s#^#$a: #" >> STATUS; done
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "ci ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log
