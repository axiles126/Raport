name: build
on:
  push:
    branches: [decomp]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: SDK 37
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $SDKM --licenses >/dev/null || true
          $SDKM "platforms;android-37" || $SDKM --list | grep -E 'platforms;android-3[6-9]|build-tools;3[6-9]' | head -20
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: assembleDebug
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - name: errors
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -300
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: Report-debug, path: app/build/outputs/apk/debug/*.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }
      - name: publish log/apk to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b ci-log
          cp $GITHUB_WORKSPACE/build.log . 2>/dev/null || echo "no build.log" > build.log
          grep -nE '^e: |^w: .*(unresolved|Unresolved)|error:|What went wrong|FAILURE' -A4 build.log > errors.txt || true
          cp $GITHUB_WORKSPACE/app/build/outputs/apk/debug/*.apk . 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "ci ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log
